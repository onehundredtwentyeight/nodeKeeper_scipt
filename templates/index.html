<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Edge Infrastructure — Status & Telemetry</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card: #131b2e;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --ok: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            max-width: 680px;
            width: 100%;
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 36px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.12);
            color: var(--ok);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: var(--ok);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--ok);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .metric {
            background: rgba(255, 255, 255, 0.03);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .metric-label {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .metric-val {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--accent);
        }
        .footer {
            font-size: 0.8rem;
            color: var(--muted);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">Edge Routing Node</div>
            <div class="badge"><span class="dot"></span> Operational</div>
        </div>
        <div class="grid">
            <div class="metric">
                <div class="metric-label">Protocol Stack</div>
                <div class="metric-val">HTTP/2 &amp; TLS 1.3</div>
            </div>
            <div class="metric">
                <div class="metric-label">Edge Anycast</div>
                <div class="metric-val">Connected</div>
            </div>
            <div class="metric">
                <div class="metric-label">Uptime SLA</div>
                <div class="metric-val">99.98%</div>
            </div>
        </div>
        <div class="footer">
            Automated edge node telemetry endpoint. Unauthorized access is prohibited.
        </div>
    </div>
</body>
</html>
