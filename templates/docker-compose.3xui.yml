x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: 5

services:
  3xui:
    image: ghcr.io/mhsanaei/3x-ui:latest
    container_name: 3xui_app
    hostname: 3xui
    <<: [*common, *logging]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./db/:/etc/x-ui/
      - ./cert/:/root/cert/
      - ./acme/:/root/.acme.sh/
    environment:
      - XRAY_VMESS_AEAD_FORCED=false
      - XUI_ENABLE_FAIL2BAN=true
      # Uncomment below (and the postgres service) when XUI_DB_TYPE=postgres:
      # - XUI_DB_TYPE=postgres
      # - XUI_DB_DSN=postgres://xui:${XUI_PG_PASSWORD}@127.0.0.1:5432/xui?sslmode=disable
    tty: true

  # Optional PostgreSQL backend container (automatically enabled by nodeKeeper when XUI_DB_TYPE=postgres):
